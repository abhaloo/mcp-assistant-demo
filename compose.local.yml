# Local override: docker compose -f compose.demo.yml -f compose.local.yml up --build -d
# Builds both images from this tree and serves the billing app on http://localhost:8095.
# No TLS, no Origin Certificate, and no other published ports.
services:
  app:
    build:
      context: ./billing
      dockerfile: Dockerfile
    image: mcp-assistant-demo-billing:local
    ports: !override
      - "8095:80"
    volumes: !override
      - app_storage:/app/storage
    environment:
      APP_URL: http://localhost:8095

  rag-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-assistant-demo-rag:local

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-assistant-demo-rag:local
