name: Build and Push Demo Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  billing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push billing image
        uses: docker/build-push-action@v5
        with:
          context: ./billing
          file: ./billing/Dockerfile
          push: true
          tags: |
            ghcr.io/abhaloo/mcp-assistant-demo-billing:sha-${{ github.sha }}
            ghcr.io/abhaloo/mcp-assistant-demo-billing:demo

  rag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RAG image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/abhaloo/mcp-assistant-demo-rag:sha-${{ github.sha }}
            ghcr.io/abhaloo/mcp-assistant-demo-rag:demo
